<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes NetworkPolicy Scope Audit</title><desc id="desc">A minimal high-contrast navy graphic showing namespace and pod selector logic as a clear network path.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081722"/><stop offset="1" stop-color="#162F3D"/></linearGradient><linearGradient id="c" x1="0" x2="1"><stop stop-color="#00D9FF"/><stop offset="1" stop-color="#00FFA3"/></linearGradient></defs>
<rect width="1400" height="410" rx="32" fill="url(#bg)"/>
<g opacity=".12" stroke="#00D9FF"><path d="M0 88h1400M0 188h1400M0 288h1400M180 0v410M380 0v410M580 0v410M780 0v410M980 0v410M1180 0v410"/></g>
<text x="72" y="83" font-family="Arial,Helvetica,sans-serif" font-size="23" letter-spacing="5" fill="#00FFA3">AREAZERO / KUBERNETES POLICY</text>
<text x="72" y="163" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" fill="#FFFFFF">One line of YAML.</text>
<text x="72" y="230" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" fill="#FFFFFF">A wider boundary.</text>
<text x="72" y="288" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#B5CAD6">Review selector scope before deployment</text>
<rect x="850" y="100" width="452" height="225" rx="22" fill="#0E2436" stroke="#40758A" stroke-width="2"/>
<text x="875" y="135" font-family="monospace" font-size="19" fill="#A7D2DC">NAMESPACE</text>
<rect x="884" y="162" width="180" height="114" rx="15" fill="#123C49" stroke="#00D9FF"/>
<rect x="1084" y="162" width="180" height="114" rx="15" fill="#134331" stroke="#00FFA3"/>
<text x="902" y="200" font-family="monospace" font-size="19" fill="#00D9FF">podSelector</text>
<text x="1120" y="200" font-family="monospace" font-size="19" fill="#00FFA3">network</text>
<path d="M1060 221H1082" stroke="url(#c)" stroke-width="6" stroke-linecap="round"/>
<text x="902" y="246" font-family="monospace" font-size="18" fill="#B5CAD6">AND / OR?</text>
<text x="1110" y="246" font-family="monospace" font-size="18" fill="#B5CAD6">scope</text>
</svg>
